name: FINRA fetch to Postgres (alpha-pg)

on:
  # If legacy branch publishing is enabled, restore the database-backed artifact
  # after its template build. Custom deploy-pages runs do not trigger this event.
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 11 * * 1-5" # 7:17 a.m. EDT / 6:17 a.m. EST; allow time to publish before 9 a.m. Eastern
  workflow_dispatch:
    inputs:
      backfill:
        description: "Load every known settlement date"
        type: boolean
        default: false
      refresh:
        description: "Reload historical periods too (use with backfill)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: finra-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Secrets are scoped to the steps that use them, not the job: pip, the tests
    # and third-party actions never see them. DATABASE_URL format (see
    # postgres/finra_schema.sql for the roles):
    #   postgresql://<user>:<password>@<host>:5432/<db>?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt
    env:
      FINRA_SCHEMA: finra
      BACKFILL: ${{ inputs.backfill }}
      REFRESH: ${{ inputs.refresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check database secret
        env:
          HAS_URL: ${{ secrets.DATABASE_URL != '' }}
        run: test "$HAS_URL" = true || { echo 'Missing DATABASE_URL repository secret'; exit 1; }
      - run: pip install -r requirements-finra.txt
      - run: python -m unittest discover -s tests -p 'test_finra_supabase.py'
      - name: Ingest FINRA
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          args=()
          if [[ "$BACKFILL" == 'true' ]]; then args+=(--backfill); fi
          if [[ "$REFRESH" == 'true' ]]; then args+=(--refresh); fi
          python ingest_finra_supabase.py "${args[@]}"

  build:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-finra.txt
      - run: python -m unittest discover -s tests
      - name: Build and validate dashboard from Postgres
        run: python publish_finra_dashboard.py --output-dir site
        env:
          # Read-only login when configured (finra_reader); the build never writes.
          DATABASE_URL: ${{ secrets.DATABASE_URL_RO || secrets.DATABASE_URL }}
          FINRA_SCHEMA: finra
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
